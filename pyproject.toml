[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "asistencia-ia"
version = "0.1.0"
description = "Esqueleto del sistema de conteo e identificacion estudiantil."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162,<1",
    "insightface>=2.1,<3",
    "numpy>=1.26,<3",
    "onnxruntime>=1.31,<2",
    "opencv-python>=4.9,<5",
    "pandas>=2.2,<3",
    "Pillow>=10,<13",
    "python-multipart>=0.0.32,<1",
    "ultralytics>=8.2,<9",
    "uvicorn>=0.54,<1",
]

[project.scripts]
asistencia-api = "asistencia_ia.api:main"
asistencia-catalog = "asistencia_ia.data.catalog:main"

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.2,<5",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
